[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-lib"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ccxt",
    "pandas",
    "pyarrow",
    "vectorbt",
    "matplotlib",
    "numpy",
    "tqdm",
]

[tool.setuptools]
py-modules = ["data_manager", "backtest_vectorbt", "backtest_analysis"]
