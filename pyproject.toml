[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-lib"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ccxt",
    "pandas",
    "pyarrow",
    "vectorbt",
    "matplotlib",
    "numpy",
    "rich",
    "ib-insync",
    "requests",
    "python-dotenv",
]

[tool.setuptools]
py-modules = ["backtest_vectorbt", "backtest_analysis"]
packages = ["data_manager", "data_manager.providers", "broker", "broker.brokers", "strategies"]
